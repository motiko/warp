# cargo-about configuration for generating third-party license attribution.
#
# The accepted license list must stay in sync with deny.toml's [licenses.allow].
# CI enforces this via script/check_license_config_sync.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Exclude private workspace crates (publish = false).
private = { ignore = true }

# Build and dev dependencies are not redistributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Built-in workarounds for crates with complicated license packaging.
workarounds = [
    "ring",
    "rustls",
]

# These crates are sourced via git from the warpdotdev organization (the upstream Warp
# project). They are not part of this workspace and do not carry explicit license fields
# yet, so cargo-about skips them during generation. Once upstream publishes them with
# license fields they will be included automatically and `--fail` can be added back to
# the generate invocation.
#
# Excluded crates (same as deny.toml exceptions):
#   - command-corrections
#   - session-sharing-protocol
#   - warp-command-signatures
#   - warp-completion-metadata
#   - warp-workflows
#   - warp-workflows-types
