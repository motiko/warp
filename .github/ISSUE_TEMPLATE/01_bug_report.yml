name: Bug Report
description: "Found a bug? Please search the open issues first to make sure it isn't already reported."
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have searched the open issues and there are no duplicates"
          required: true
        - label: "I have included the log file (optional, but it helps). On macOS it is `~/Library/Logs/alefbet.log`."
          required: false
  - type: textarea
    id: "describe-the-bug"
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: "to-reproduce"
    attributes:
      label: "To reproduce"
      description: "Bug reports with a clear reproduction get addressed more quickly."
      placeholder: "Steps to reproduce: 1. Go to '...' 2. Click on '...' 3. See error '...'"
    validations:
      required: true
  - type: textarea
    id: "expected-behavior"
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: false
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots, videos, or logs to help explain the problem."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating system version"
      description: "For example: macOS 15.3"
    validations:
      required: true
  - type: input
    id: "shell-version"
    attributes:
      label: "Shell and version"
      description: "For example `zsh 5.9`. Run `bash --version`, `zsh --version`, or `fish --version`."
    validations:
      required: false
  - type: input
    id: "alefbet-version"
    attributes:
      label: "Alefbet version or commit"
      description: "The version shown in Settings, or the git commit you built from."
    validations:
      required: false
  - type: dropdown
    id: "terminals"
    attributes:
      label: "Is this an issue only in Alefbet?"
      description: "Confirming that the issue does not happen in other terminals helps narrow it down."
      multiple: false
      options:
        - "Yes, this only happens in Alefbet, not in other terminals."
        - "No, this happens in Alefbet and in other terminals."
        - "I have not checked."
    validations:
      required: false
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Add any other context about the problem here. On Linux, say whether you are using X11 or Wayland."
    validations:
      required: false
